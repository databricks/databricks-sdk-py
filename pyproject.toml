[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-sdk"
dynamic = ["version"]
description = "Databricks SDK for Python (Beta)"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["databricks", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.1,<3",
    "google-auth~=2.0",
    # Exclude vulnerable protobuf versions: [,4.25.8), [5.26.0rc1, 5.29.5), [6.30.0rc1, 6.31.1)
    # https://security.snyk.io/vuln/SNYK-PYTHON-PROTOBUF-10364902
    "protobuf>=4.25.8,!=5.26.*,!=5.27.*,!=5.28.*,!=5.29.0,!=5.29.1,!=5.29.2,!=5.29.3,!=5.29.4,!=6.30.0,!=6.30.1,!=6.31.0,<7.0",
    # Imported directly (databricks/sdk/_base_client.py); declared
    # explicitly rather than relied on transitively through requests.
    "urllib3>=1.26,<3",
]

[project.urls]
Documentation = "https://databricks-sdk-py.readthedocs.io"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.6.1,<4.0",
    "pytest-mock",
    "ruff==0.5.6",
    "pycodestyle",
    "wheel",
    "ipython",
    "ipywidgets",
    "requests-mock",
    "pyfakefs",
    "openai",
    "langchain-openai",
    "httpx",
    "grpcio>=1.81.1,<2", # the sandbox extra's dep; also needed to run the gRPC transport unit tests
    "build", # some integration tests depend on the databricks-sdk-py wheel
    "check-manifest",
]
notebook = [
    "ipython>=8,<10",
    "ipywidgets>=8,<9",
]
openai = [
    "openai",
    "langchain-openai",
    "httpx",
]
sandbox = [
    # gRPC transport and committed stubs for the sandbox command-execution
    # mixin. Optional so users who don't use the sandbox APIs don't pull the
    # large native grpcio wheel; grpcio and the stubs are imported lazily (see
    # databricks/sdk/mixins/_grpc_transport.py and mixins/sandbox.py).
    #
    # The floors match the version checks baked into the committed stubs: the
    # generated sandbox_service_pb2.py validates protobuf >= 6.33.5 and
    # sandbox_service_pb2_grpc.py validates grpcio >= 1.81.1 at import, so an
    # older runtime that satisfied only the core protobuf floor / an unbounded
    # grpcio would raise on import. `<2` caps grpcio's major to guard against a
    # breaking 2.x. protobuf's core dependency (above) supplies the `<7` cap and
    # the CVE exclusions.
    "protobuf>=6.33.5",
    "grpcio>=1.81.1,<2",
]

[tool.setuptools.dynamic]
version = { attr = "databricks.sdk.version.__version__" }

[tool.setuptools.packages.find]
include = ["databricks", "databricks.*"]

[tool.setuptools.package-data]
"databricks.sdk" = ["py.typed"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py39"
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__"]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.10"
